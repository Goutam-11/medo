# medo — a cute, day-scoped task manager for Noctalia v5.
#
# Phase 0 scaffold: the service publishes an empty view, the bar widget renders
# done/total, and the panel opens. The real store, tabs, slider and reports
# arrive in the next phases (see docs/PLAN.md).
#
# plugin_api 43 is the ceiling on Noctalia 5.4.1 (44+ is unreleased), and is what
# `height = "content"` panels require.
id = "goutamsharma/medo"
name = "medo"
version = "0.1.0"
plugin_api = 43
author = "goutamsharma"
icon = "checklist"
description = "A cute day-scoped task manager: progress sliders, a 04:00 rollover that carries leftovers, and weekly efficiency reports."
tags = ["bar", "panel", "service", "productivity"]

# Headless core: owns tasks.json, the logical day, rollover, reminders and
# reports. Every other entry talks to it through noctalia.state.
[[service]]
id = "core"
entry = "core.luau"

# Bar: the done/total counter plus the Medo glyph.
[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "checklist"

# The five-tab surface. Auto-sized to its content up to max_height.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 460
height = "content"
max_height = 760
placement = "attached"
position = "auto"
open_near_click = true
