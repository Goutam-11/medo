# medo — a cute, day-scoped task manager for Noctalia v5.
#
# Phase 0 scaffold: the service publishes an empty view, the bar widget renders
# done/total, and the panel opens. The real store, tabs, slider and reports
# arrive in the next phases (see docs/PLAN.md).
#
# plugin_api 43 is the ceiling on Noctalia 5.4.1 (44+ is unreleased), and is what
# `height = "content"` panels require.
id = "goutamsharma/medo"
name = "medo"
version = "0.1.0"
plugin_api = 43
author = "goutamsharma"
icon = "checklist"
description = "A cute day-scoped task manager: progress sliders, a 04:00 rollover that carries leftovers, and weekly efficiency reports."
tags = ["bar", "panel", "service", "productivity"]

# Plugin-level settings, shared by every entry (Settings -> Plugins -> medo).
[[setting]]
key = "rollover_hour"
type = "int"
min = 0
max = 23
label_key = "settings.rollover_hour.label"
description_key = "settings.rollover_hour.description"
default = 4

[[setting]]
key = "cap_enabled"
type = "bool"
label_key = "settings.cap_enabled.label"
description_key = "settings.cap_enabled.description"
default = true

[[setting]]
key = "daily_cap"
type = "int"
min = 1
max = 10
label_key = "settings.daily_cap.label"
description_key = "settings.daily_cap.description"
default = 3

[[setting]]
key = "default_estimate"
type = "int"
min = 5
max = 480
label_key = "settings.default_estimate.label"
description_key = "settings.default_estimate.description"
default = 20

[[setting]]
key = "streak_threshold"
type = "int"
min = 0
max = 100
label_key = "settings.streak_threshold.label"
description_key = "settings.streak_threshold.description"
default = 70

[[setting]]
key = "trash_days"
type = "int"
min = 1
max = 365
label_key = "settings.trash_days.label"
description_key = "settings.trash_days.description"
default = 30

# Where Report -> Export writes medo-<period>-<day>.md / .json. Empty uses the
# user's documents folder; the service resolves and creates it on first export.
[[setting]]
key = "export_dir"
type = "folder"
label_key = "settings.export_dir.label"
description_key = "settings.export_dir.description"
default = ""

# ── sound and mascot (Phase 4c) ─────────────────────────────────────────────
# The cues are bundled .ogg files played by the service (sound names are scoped
# to one entry runtime); playback honors [audio].sound_volume. The mascot is a
# bundled PNG in the panel header and dashboard, with the text face as fallback.

[[setting]]
key = "sounds_enabled"
type = "bool"
label_key = "settings.sounds_enabled.label"
description_key = "settings.sounds_enabled.description"
default = true

[[setting]]
key = "mascot_enabled"
type = "bool"
label_key = "settings.mascot_enabled.label"
description_key = "settings.mascot_enabled.description"
default = true

# ── notifications (Phase 4) ─────────────────────────────────────────────────
# The service evaluates these on its one-second tick and dedupes them in
# state.json. Times are local "HH:MM"; a toast fires within 60 minutes of its
# scheduled time and never replays after a long sleep.

[[setting]]
key = "notify_morning"
type = "bool"
label_key = "settings.notify_morning.label"
description_key = "settings.notify_morning.description"
default = true

[[setting]]
key = "notify_evening"
type = "bool"
label_key = "settings.notify_evening.label"
description_key = "settings.notify_evening.description"
default = true

[[setting]]
key = "notify_due"
type = "bool"
label_key = "settings.notify_due.label"
description_key = "settings.notify_due.description"
default = true

[[setting]]
key = "notify_lead"
type = "bool"
label_key = "settings.notify_lead.label"
description_key = "settings.notify_lead.description"
default = true

[[setting]]
key = "notify_weekly"
type = "bool"
label_key = "settings.notify_weekly.label"
description_key = "settings.notify_weekly.description"
default = true

[[setting]]
key = "notify_monthly"
type = "bool"
label_key = "settings.notify_monthly.label"
description_key = "settings.notify_monthly.description"
default = true

[[setting]]
key = "notify_atrisk"
type = "bool"
label_key = "settings.notify_atrisk.label"
description_key = "settings.notify_atrisk.description"
default = true

[[setting]]
key = "morning_time"
type = "string"
label_key = "settings.morning_time.label"
description_key = "settings.morning_time.description"
default = "08:00"

[[setting]]
key = "evening_time"
type = "string"
label_key = "settings.evening_time.label"
description_key = "settings.evening_time.description"
default = "21:00"

[[setting]]
key = "atrisk_time"
type = "string"
label_key = "settings.atrisk_time.label"
description_key = "settings.atrisk_time.description"
default = "15:00"

[[setting]]
key = "weekly_day"
type = "select"
label_key = "settings.weekly_day.label"
description_key = "settings.weekly_day.description"
default = "7"
options = [
  { value = "1", label_key = "settings.weekly_day.monday" },
  { value = "2", label_key = "settings.weekly_day.tuesday" },
  { value = "3", label_key = "settings.weekly_day.wednesday" },
  { value = "4", label_key = "settings.weekly_day.thursday" },
  { value = "5", label_key = "settings.weekly_day.friday" },
  { value = "6", label_key = "settings.weekly_day.saturday" },
  { value = "7", label_key = "settings.weekly_day.sunday" },
]

[[setting]]
key = "weekly_time"
type = "string"
label_key = "settings.weekly_time.label"
description_key = "settings.weekly_time.description"
default = "20:00"

[[setting]]
key = "monthly_time"
type = "string"
label_key = "settings.monthly_time.label"
description_key = "settings.monthly_time.description"
default = "20:00"

[[setting]]
key = "quiet_start"
type = "string"
label_key = "settings.quiet_start.label"
description_key = "settings.quiet_start.description"
default = "22:00"

[[setting]]
key = "quiet_end"
type = "string"
label_key = "settings.quiet_end.label"
description_key = "settings.quiet_end.description"
default = "07:00"

[[setting]]
key = "lead_min"
type = "int"
min = 0
max = 120
label_key = "settings.lead_min.label"
description_key = "settings.lead_min.description"
default = 15

# Headless core: owns tasks.json, the logical day, rollover, reminders and
# reports. Every other entry talks to it through noctalia.state.
[[service]]
id = "core"
entry = "core.luau"

# Bar: the done/total counter plus the Medo glyph.
[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "checklist"

# Launcher capture: `medo buy milk @17:00 #errand !high` adds a task without
# opening the panel. Kept out of the un-prefixed global search so typing "buy"
# does not offer to create a task by accident.
[[launcher_provider]]
id = "quick"
entry = "quick.luau"
prefix = "medo"
glyph = "checklist"
include_in_global_search = false

# The five-tab surface. Auto-sized to its content up to max_height.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 460
height = "content"
max_height = 760
placement = "attached"
position = "auto"
open_near_click = true
